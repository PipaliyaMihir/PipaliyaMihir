<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="360"
     viewBox="0 0 1200 360">

<defs>

  <!-- ================= BACKGROUND ================= -->

  <linearGradient id="bg"
                  x1="0" y1="0"
                  x2="1" y2="1">

    <stop offset="0%" stop-color="#050505"/>
    <stop offset="55%" stop-color="#0A0A0F"/>
    <stop offset="100%" stop-color="#111827"/>

  </linearGradient>


  <!-- ================= ACCENT ================= -->

  <linearGradient id="accent"
                  x1="0" y1="0"
                  x2="1" y2="1">

    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#6366F1"/>
    <stop offset="100%" stop-color="#C084FC"/>

  </linearGradient>


  <linearGradient id="name"
                  x1="0" y1="0"
                  x2="1" y2="0">

    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="65%" stop-color="#F1F5F9"/>
    <stop offset="100%" stop-color="#67E8F9"/>

  </linearGradient>


  <!-- ================= GLOW ================= -->

  <filter id="glow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur
      stdDeviation="5"
      result="blur"/>

    <feMerge>

      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>

    </feMerge>

  </filter>


  <filter id="bigGlow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur
      stdDeviation="40"/>

  </filter>


  <!-- ================= MASK ================= -->

  <linearGradient id="fade"
                  x1="0" y1="0"
                  x2="1" y2="0">

    <stop offset="0%" stop-color="white"/>
    <stop offset="100%" stop-color="black"/>

  </linearGradient>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect
  width="1200"
  height="360"
  rx="28"
  fill="url(#bg)"/>


<!-- ================================================= -->
<!-- AMBIENT LIGHT -->
<!-- ================================================= -->

<circle
  cx="900"
  cy="160"
  r="180"
  fill="#6366F1"
  opacity=".08"
  filter="url(#bigGlow)"/>


<circle
  cx="1080"
  cy="300"
  r="100"
  fill="#22D3EE"
  opacity=".06"
  filter="url(#bigGlow)"/>


<!-- ================================================= -->
<!-- ABSTRACT DATA WAVE -->
<!-- ================================================= -->

<g
  fill="none"
  stroke="url(#accent)"
  stroke-linecap="round">

  <path
    d="M500 300
       C610 270 620 100 730 115
       C825 128 820 260 900 245
       C970 232 980 80 1135 65"

    stroke-width="1"
    opacity=".18"/>


  <path
    d="M500 320
       C625 285 640 145 735 145
       C820 145 825 230 900 225
       C980 220 1010 105 1150 95"

    stroke-width="2"
    opacity=".30"/>


  <path
    d="M500 335
       C630 300 655 180 745 170
       C825 160 850 205 910 205
       C1000 205 1035 125 1160 120"

    stroke-width="1"
    opacity=".16"/>


  <!-- bright main wave -->

  <path
    d="M500 315
       C620 280 645 125 735 130
       C820 135 835 245 910 230
       C990 215 1010 90 1160 80"

    stroke-width="3"
    opacity=".65"
    filter="url(#glow)"/>

</g>


<!-- ================================================= -->
<!-- FLOATING DATA PARTICLES -->
<!-- ================================================= -->

<g fill="#67E8F9"
   filter="url(#glow)">

  <circle cx="600" cy="250" r="3"/>
  <circle cx="665" cy="150" r="2"/>
  <circle cx="735" cy="130" r="4"/>
  <circle cx="810" cy="205" r="2"/>
  <circle cx="910" cy="230" r="4"/>
  <circle cx="1000" cy="150" r="2"/>
  <circle cx="1080" cy="100" r="3"/>

</g>


<!-- ================================================= -->
<!-- LEFT TYPOGRAPHY -->
<!-- ================================================= -->

<g>

  <!-- small top label -->

  <text
    x="70"
    y="76"
    fill="#64748B"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    letter-spacing="4">

    AI / MACHINE LEARNING

  </text>


  <!-- accent line -->

  <rect
    x="70"
    y="96"
    width="70"
    height="4"
    rx="2"
    fill="url(#accent)"/>


  <!-- BIG NAME -->

  <text
    x="70"
    y="155"
    fill="url(#name)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="-1">

    MIHIR

  </text>


  <text
    x="70"
    y="215"
    fill="url(#name)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="-1">

    PIPALIYA

  </text>


  <!-- minimal subtitle -->

  <text
    x="73"
    y="250"
    fill="#94A3B8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    letter-spacing="2">

    PYTHON  ·  AI  ·  DATA

  </text>


  <!-- tiny statement -->

  <text
    x="73"
    y="280"
    fill="#475569"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18">

    BUILDING THE FUTURE WITH CODE

  </text>

</g>


<!-- ================================================= -->
<!-- RIGHT ABSTRACT AI OBJECT -->
<!-- ================================================= -->

<g>

  <!-- Large translucent circle -->

  <circle
    cx="1000"
    cy="180"
    r="105"
    fill="none"
    stroke="url(#accent)"
    stroke-width="1"
    opacity=".12"/>


  <circle
    cx="1000"
    cy="180"
    r="78"
    fill="none"
    stroke="url(#accent)"
    stroke-width="1"
    opacity=".20"/>


  <!-- Rotated geometric frame -->

  <rect
    x="935"
    y="115"
    width="130"
    height="130"
    rx="25"
    fill="none"
    stroke="url(#accent)"
    stroke-width="1"
    opacity=".18"
    transform="rotate(45 1000 180)"/>


  <!-- central core -->

  <circle
    cx="1000"
    cy="180"
    r="42"
    fill="#6366F1"
    opacity=".08"
    filter="url(#bigGlow)"/>


  <circle
    cx="1000"
    cy="180"
    r="32"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"
    opacity=".8"
    filter="url(#glow)">


    <animate
      attributeName="r"
      values="28;36;28"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="1000"
    cy="180"
    r="9"
    fill="#FFFFFF"
    filter="url(#glow)">


    <animate
      attributeName="r"
      values="7;11;7"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- orbiting particle -->

  <circle
    r="4"
    fill="#22D3EE"
    filter="url(#glow)">

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M1000 70
            C1080 100 1110 180 1000 290
            C900 250 900 110 1000 70"/>

  </circle>


  <circle
    r="3"
    fill="#C084FC"
    filter="url(#glow)">

    <animateMotion
      dur="6s"
      repeatCount="indefinite"
      path="M1000 290
            C900 250 900 110 1000 70
            C1080 100 1110 180 1000 290"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- SMALL DECORATIVE MARKS -->
<!-- ================================================= -->

<g fill="#64748B">

  <circle cx="550" cy="70" r="1.5"/>
  <circle cx="600" cy="95" r="1"/>
  <circle cx="1140" cy="300" r="1.5"/>
  <circle cx="1100" cy="320" r="1"/>

</g>


<!-- ================================================= -->
<!-- BORDER -->
<!-- ================================================= -->

<rect
  x="1"
  y="1"
  width="1198"
  height="358"
  rx="28"
  fill="none"
  stroke="#334155"
  stroke-opacity=".35"/>

</svg>