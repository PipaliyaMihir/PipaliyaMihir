<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Mihir Pipaliya - AI / Machine Learning">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050505"/>
    <stop offset="55%" stop-color="#0A0A0F"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#6366F1"/>
    <stop offset="100%" stop-color="#C084FC"/>
  </linearGradient>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="40"/>
  </filter>

  <filter id="nameGlow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>

  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#64748B" fill-opacity="0.18"/>
  </pattern>

  <clipPath id="card"><rect width="1200" height="360" rx="28"/></clipPath>
</defs>


<style>
  .r{animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards}
  .r1{animation-delay:.1s}
  .r2{animation-delay:.3s}
  .r3{animation-delay:.5s}
  .r4{animation-delay:.8s}
  .r5{animation-delay:1.2s}
  .r6{animation-delay:1.5s}
  .line{transform-box:fill-box;transform-origin:left center}
  .r2.line{animation-name:grow}
  @keyframes rise{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>

<g clip-path="url(#card)">

<!-- BACKGROUND -->
<rect width="1200" height="360" fill="url(#bg)"/>
<rect x="470" width="730" height="360" fill="url(#dots)"/>

<!-- AMBIENT LIGHT (slow breathing) -->
<circle cx="900" cy="160" r="180" fill="#6366F1" opacity=".08" filter="url(#bigGlow)">
  <animate attributeName="opacity" values=".05;.13;.05" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="1080" cy="300" r="100" fill="#22D3EE" opacity=".06" filter="url(#bigGlow)">
  <animate attributeName="opacity" values=".04;.11;.04" dur="7s" repeatCount="indefinite"/>
</circle>


<!-- DATA WAVE -->
<g fill="none" stroke="url(#accent)" stroke-linecap="round">
  <path d="M500 300 C610 270 620 100 730 115 C825 128 820 260 900 245 C970 232 980 80 1135 65" stroke-width="1" opacity=".18"/>
  <path d="M500 320 C625 285 640 145 735 145 C820 145 825 230 900 225 C980 220 1010 105 1150 95" stroke-width="2" opacity=".30"/>
  <path d="M500 335 C630 300 655 180 745 170 C825 160 850 205 910 205 C1000 205 1035 125 1160 120" stroke-width="1" opacity=".16"/>

  <!-- bright main wave -->
  <path d="M500 315 C620 280 645 125 735 130 C820 135 835 245 910 230 C990 215 1010 90 1160 80" stroke-width="3" opacity=".65" filter="url(#glow)"/>
</g>

<!-- light pulse travelling along the main wave -->
<path d="M500 315 C620 280 645 125 735 130 C820 135 835 245 910 230 C990 215 1010 90 1160 80"
      fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".9"
      pathLength="1000" stroke-dasharray="70 930" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="70;-930" dur="4.5s" repeatCount="indefinite"/>
</path>

<!-- data points riding the wave -->
<g filter="url(#glow)">
  <circle r="4" fill="#67E8F9">
    <animateMotion dur="9s" repeatCount="indefinite" path="M500 315 C620 280 645 125 735 130 C820 135 835 245 910 230 C990 215 1010 90 1160 80"/>
  </circle>
  <circle r="3" fill="#A5B4FC">
    <animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M500 315 C620 280 645 125 735 130 C820 135 835 245 910 230 C990 215 1010 90 1160 80"/>
  </circle>
  <circle r="2.5" fill="#C084FC">
    <animateMotion dur="9s" begin="-6s" repeatCount="indefinite" path="M500 315 C620 280 645 125 735 130 C820 135 835 245 910 230 C990 215 1010 90 1160 80"/>
  </circle>
</g>

<!-- fixed data nodes, twinkling -->
<g fill="#67E8F9" filter="url(#glow)">
  <circle cx="600" cy="250" r="3"><animate attributeName="opacity" values="1;.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="665" cy="150" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="735" cy="130" r="4"><animate attributeName="opacity" values="1;.4;1" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="810" cy="205" r="2"><animate attributeName="opacity" values=".4;1;.4" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="910" cy="230" r="4"><animate attributeName="opacity" values="1;.35;1" dur="3.9s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="150" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="100" r="3"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
</g>


<!-- LEFT TYPOGRAPHY -->
<g font-family="Arial, Helvetica, sans-serif">

  <text class="r r1" x="70" y="74" fill="#94A3B8" font-size="15" letter-spacing="4">AI / MACHINE LEARNING</text>

  <rect class="r r2 line" x="70" y="94" width="70" height="4" rx="2" fill="url(#accent)"/>

  <!-- soft glow behind the name -->
  <g filter="url(#nameGlow)" opacity=".55" fill="#22D3EE" font-size="66" font-weight="700" letter-spacing="-1">
    <text x="70" y="160">MIHIR</text>
    <text x="70" y="228">PIPALIYA</text>
  </g>

  <!-- NAME -->
  <text class="r r3" x="70" y="160" fill="#FFFFFF" font-size="66" font-weight="700" letter-spacing="-1">MIHIR</text>
  <text class="r r4" x="70" y="228" fill="#FFFFFF" font-size="66" font-weight="700" letter-spacing="-1">PIPALIYA</text>

  <text class="r r5" x="73" y="264" fill="#CBD5E1" font-size="15" letter-spacing="2">PYTHON  ·  DATA SCIENCE  ·  MACHINE LEARNING</text>

  <text class="r r6" x="73" y="292" fill="#94A3B8" font-size="14" letter-spacing="1.5">BUILD AI. SOLVE PROBLEMS. KEEP GROWING.</text>

</g>


<!-- RIGHT: AI CORE -->
<g>
  <!-- outer ring, slow dashed spin -->
  <circle cx="1000" cy="180" r="105" fill="none" stroke="url(#accent)" stroke-width="1" opacity=".22" stroke-dasharray="2 9">
    <animateTransform attributeName="transform" type="rotate" from="0 1000 180" to="360 1000 180" dur="40s" repeatCount="indefinite"/>
  </circle>

  <!-- inner ring, opposite spin -->
  <circle cx="1000" cy="180" r="78" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity=".35" stroke-dasharray="36 14">
    <animateTransform attributeName="transform" type="rotate" from="360 1000 180" to="0 1000 180" dur="28s" repeatCount="indefinite"/>
  </circle>

  <!-- geometric frame -->
  <rect x="935" y="115" width="130" height="130" rx="25" fill="none" stroke="url(#accent)" stroke-width="1" opacity=".22">
    <animateTransform attributeName="transform" type="rotate" from="45 1000 180" to="405 1000 180" dur="36s" repeatCount="indefinite"/>
  </rect>

  <!-- core glow -->
  <circle cx="1000" cy="180" r="42" fill="#6366F1" opacity=".08" filter="url(#bigGlow)"/>

  <!-- pulsing ring -->
  <circle cx="1000" cy="180" r="32" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".8" filter="url(#glow)">
    <animate attributeName="r" values="28;36;28" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ripple leaving the core -->
  <circle cx="1000" cy="180" r="12" fill="none" stroke="#22D3EE" stroke-width="1.2">
    <animate attributeName="r" values="12;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- core -->
  <circle cx="1000" cy="180" r="9" fill="#FFFFFF" filter="url(#glow)">
    <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting particles -->
  <circle r="4" fill="#22D3EE" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M1000 70 C1080 100 1110 180 1000 290 C900 250 900 110 1000 70"/>
  </circle>
  <circle r="3" fill="#C084FC" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M1000 290 C900 250 900 110 1000 70 C1080 100 1110 180 1000 290"/>
  </circle>
</g>


<!-- SMALL DECORATIVE MARKS -->
<g fill="#64748B">
  <circle cx="550" cy="70" r="1.5"/>
  <circle cx="600" cy="95" r="1"/>
  <circle cx="1140" cy="300" r="1.5"/>
  <circle cx="1100" cy="320" r="1"/>
</g>

</g>


<!-- BORDER -->
<rect x="1" y="1" width="1198" height="358" rx="28" fill="none" stroke="#334155" stroke-opacity=".35"/>

</svg>